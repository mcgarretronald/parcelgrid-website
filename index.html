<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/Escrow Icon 1.png" />
    
    <!-- Viewport for responsive design -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    
    <!-- Default Meta Tags (will be overridden by Helmet in components) -->
    <title>ParcelGrid - Kenya's Leading COD Delivery Service for Online Vendors</title>
    <meta name="description" content="Expand your online business across Kenya with ParcelGrid. Cash on Delivery (COD) with instant settlements, several pickup points nationwide. Trusted by thousands of online sellers." />
    <meta name="keywords" content="COD delivery Kenya, cash on delivery, online vendor delivery, parcel delivery Kenya, instant settlements" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#00473E" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://maps.googleapis.com" />
    <link rel="preconnect" href="https://play.google.com" />
    
    <!-- DNS Prefetch for faster resource loading -->
    <link rel="dns-prefetch" href="https://drive.google.com" />
    
    <!-- Open Graph Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="ParcelGrid - Kenya's Leading COD Delivery Service" />
    <meta property="og:description" content="Join thousands of online vendors using ParcelGrid. Several pickup points, instant COD settlements." />
    <meta property="og:site_name" content="ParcelGrid" />
    
    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ParcelGrid - Kenya's Leading COD Delivery Service" />
    <meta name="twitter:description" content="Instant COD settlements, several pickup points nationwide for online vendors." />
    
    <!-- Robots -->
    <meta name="robots" content="index, follow" />
    <meta name="googlebot" content="index, follow" />
    
    <!-- Language -->
    <meta http-equiv="content-language" content="en-KE" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
