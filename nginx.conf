# Included from Alpine nginx's http{} block (http.d/). Do not set top-level
# gzip_* here — /etc/nginx/nginx.conf already enables gzip and duplicates crash
# the process (CrashLoopBackOff on DOKS).

server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Never expose server version
  server_tokens off;

  # Security headers (repeated in locations that set their own add_header)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Retired URLs -> permanent redirects (keeps search equity)
  location = /prepaid-cod { return 301 /services/pay-on-delivery-courier-kenya; }
  location = /instant-settlements { return 301 /services/pay-on-delivery-courier-kenya; }
  location = /notifications { return 301 /services/pay-on-delivery-courier-kenya; }
  location = /pickup-agent { return 301 /opportunities?role=pickup; }
  location = /booking-agent { return 301 /opportunities?role=booking; }
  location = /apply-pickup-agent { return 301 /opportunities?role=pickup; }
  location = /apply-booking-agent { return 301 /opportunities?role=booking; }
  location = /track-parcel { return 301 /track; }

  # All /api/* → Node render-server (pickup, dropoff, weight-bands, custom-parcels,
  # calculate-fee, payments, chat, …). Keeps auth tokens server-side.
  location /api/ {
    proxy_pass http://127.0.0.1:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin $http_origin;
    proxy_set_header Content-Type $content_type;
    client_max_body_size 2m;
    proxy_read_timeout 60s;
  }

  # Fingerprinted build output never changes: cache for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Static images and media: cache for 30 days
  location ~* \.(?:webp|png|jpe?g|gif|svg|ico|mp4|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Crawler files: short cache
  location ~* ^/(?:sitemap\.xml|robots\.txt)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Routes that exist only in the app (no prerendered file)
  location = /payment {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files /index.html =404;
  }

  # Pages: each prerendered route has dist/<route>/index.html. HTML is always revalidated.
  # Anything else is a real 404 (the app renders its own "page not found" from /404.html).
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
