# Gzip text assets (JS, CSS, HTML, JSON, SVG, XML)
gzip on;
gzip_comp_level 6;
gzip_min_length 256;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/xml application/xml+rss image/svg+xml application/manifest+json;

server {
  listen 80;

  root /usr/share/nginx/html;
  index index.html;

  # Never expose server version
  server_tokens off;

  # Security headers (repeated in locations that set their own add_header)
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  # Retired URLs -> permanent redirects (keeps search equity)
  location = /prepaid-cod { return 301 /services/pay-on-delivery-courier-kenya; }
  location = /instant-settlements { return 301 /services/pay-on-delivery-courier-kenya; }
  location = /notifications { return 301 /services/pay-on-delivery-courier-kenya; }
  location = /pickup-agent { return 301 /opportunities?role=pickup; }
  location = /booking-agent { return 301 /opportunities?role=booking; }
  location = /apply-pickup-agent { return 301 /opportunities?role=pickup; }
  location = /apply-booking-agent { return 301 /opportunities?role=booking; }
  location = /track-parcel { return 301 /track; }

  # Same-origin proxies for public agent catalogs.
  # Production is nginx-only (no Netlify/Render /api functions). Browser calls to
  # app.escrowcourier.com fail CORS because user-service does not allow
  # escrowcourier.com — proxy server-side and strip Origin so upstream returns 200.
  location = /api/pickup-points {
    proxy_pass https://app.escrowcourier.com/user-services/api/agents/public;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host app.escrowcourier.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "public, max-age=60" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location = /api/dropoff-points {
    proxy_pass https://app.escrowcourier.com/user-services/api/agents/allowed-drop-off-points;
    proxy_http_version 1.1;
    proxy_ssl_server_name on;
    proxy_set_header Host app.escrowcourier.com;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Origin "";
    proxy_set_header Referer "";
    proxy_hide_header Access-Control-Allow-Origin;
    add_header Cache-Control "public, max-age=60" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  # Fingerprinted build output never changes: cache for a year
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Static images and media: cache for 30 days
  location ~* \.(?:webp|png|jpe?g|gif|svg|ico|mp4|woff2?)$ {
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options "nosniff" always;
    try_files $uri =404;
  }

  # Crawler files: short cache
  location ~* ^/(?:sitemap\.xml|robots\.txt)$ {
    add_header Cache-Control "public, max-age=3600";
    try_files $uri =404;
  }

  # Routes that exist only in the app (no prerendered file)
  location = /payment {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    try_files /index.html =404;
  }

  # Pages: each prerendered route has dist/<route>/index.html. HTML is always revalidated.
  # Anything else is a real 404 (the app renders its own "page not found" from /404.html).
  location / {
    add_header Cache-Control "no-cache";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    try_files $uri $uri/index.html =404;
  }

  error_page 404 /404.html;
  location = /404.html {
    internal;
  }
}
