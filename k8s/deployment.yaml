apiVersion: apps/v1
kind: Deployment
metadata:
  name: escrow-admin-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: escrow-admin-service
  template:
    metadata:
      labels:
        app: escrow-admin-service
    spec:
      containers:
        - name: escrow-admin-service
          image: registry.digitalocean.com/escrow-mobileapp-registry/escrow-web-services:{{IMAGE_TAG}}
          ports:
            - containerPort: 3000
          envFrom:
            - secretRef:
                name: escrow-auth-env
          resources:
            requests:
              memory: "150Mi"
            limits:
              memory: "300Mi"
