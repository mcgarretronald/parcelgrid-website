apiVersion: apps/v1
kind: Deployment
metadata:
  name: escrow-web-services
spec:
  replicas: 1
  selector:
    matchLabels:
      app: escrow-web-services
  template:
    metadata:
      labels:
        app: escrow-web-services
    spec:
      containers:
        - name: escrow-web-services
          image: registry.digitalocean.com/escrow-mobileapp-registry/escrow-web-services:{{IMAGE_TAG}}
          ports:
            - containerPort: 80
          envFrom:
            - secretRef:
                name: escrow-auth-env
          resources:
            requests:
              memory: "200Mi"
            limits:
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 20
