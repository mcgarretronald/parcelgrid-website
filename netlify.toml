[build]
  publish = "dist"

# Redirects handled by serverless functions in /api/ directory


[[redirects]]
  from = "/prepaid-cod"
  to = "/services/pay-on-delivery-courier-kenya"
  status = 301
  force = true

[[redirects]]
  from = "/instant-settlements"
  to = "/services/pay-on-delivery-courier-kenya"
  status = 301
  force = true

[[redirects]]
  from = "/notifications"
  to = "/services/pay-on-delivery-courier-kenya"
  status = 301
  force = true

[[redirects]]
  from = "/pickup-agent"
  to = "/opportunities?role=pickup"
  status = 301
  force = true

[[redirects]]
  from = "/booking-agent"
  to = "/opportunities?role=booking"
  status = 301
  force = true

[[redirects]]
  from = "/apply-pickup-agent"
  to = "/opportunities?role=pickup"
  status = 301
  force = true

[[redirects]]
  from = "/apply-booking-agent"
  to = "/opportunities?role=booking"
  status = 301
  force = true

[[redirects]]
  from = "/track-parcel"
  to = "/track"
  status = 301
  force = true

# The app handles /payment on the client
[[redirects]]
  from = "/payment"
  to = "/index.html"
  status = 200

# Long-lived caching for fingerprinted assets; HTML always revalidates
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"
